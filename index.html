<style>

.dtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}

.detail .sec{display:none}.detail[data-tab=info] .sec[data-sec=info],.detail[data-tab=fund] .sec[data-sec=fund],.detail[data-tab=inst] .sec[data-sec=inst]{display:block}
.nform{display:grid;gap:8px;padding:12px}.nform textarea,.ncard textarea{width:100%;box-sizing:border-box;min-height:70px;resize:vertical;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}.nform .nr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nform select{max-width:100%;font:inherit;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}.ncard{padding:10px 12px;border-bottom:1px solid var(--line)}.ncard:last-child{border-bottom:0}.nh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--sub)}.nh .sp{flex:1}.nlink{cursor:pointer;color:var(--acc);text-decoration:underline}.ndel{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px}.ndel:hover{border-color:var(--danger);color:var(--danger)}
.cset{display:grid;gap:5px;margin-top:6px}.cset label{font-size:11px;color:var(--sub);margin-top:4px}.cset input{width:100%;box-sizing:border-box;font:inherit;font-size:12px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.tscroll{max-height:calc(100vh - 330px);min-height:240px;overflow:auto}
.card:not(.tscroll):not(.pscroll){max-height:none}.pscroll{max-height:calc(100vh - 250px);min-height:240px;overflow:auto}.card.pscroll.hp{max-height:calc(100vh - 290px)}th{box-shadow:0 1px 0 var(--line);z-index:2}

</style></head><body><div class="app"><aside class="side"><div><h1>예적금 관리</h1><div class="sub" id="asof"></div></div>
<nav class="nav" id="tabs"><button class="tab on" data-t="dash">📅 대시보드</button><button class="tab" data-t="list">📋 목록</button><button class="tab" data-t="flow">💰 월별 자금 흐름</button><button class="tab" data-t="memo">📝 메모</button><button class="tab" data-t="check">✔ 점검</button></nav>
<details class="more" id="connBox"><summary>🔗 연결 설정</summary><div class="cset"><label>웹앱 주소 (Apps Script 배포 URL)</label><input id="cUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"><label>비밀키</label><input id="cKey" type="password" placeholder="설정한 비밀키" autocomplete="off"><label>구글 클라이언트 ID (선택)</label><input id="cCid" placeholder="…apps.googleusercontent.com" autocomplete="off"><div id="gBtn"></div><div class="side-actions"><button class="btn" id="cSave">연결 저장</button><button class="btn" id="cOff">연결 해제</button></div><div class="note" id="cNote"></div></div></details>

<div class="theme" id="theme"><button data-th="auto" title="기기(윈도우) 설정을 따라갑니다">자동</button><button data-th="light">☀ 라이트</button><button data-th="dark">🌙 다크</button></div>

<div class="note" id="protoNote">구조 확인용 파일입니다. 연결 설정을 하지 않으면 고친 값은 이 창을 닫으면 사라집니다. 계좌번호는 넣지 않았습니다.</div></main></div>

<script>
const RAW=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=new Date();const todayS=new Date(TODAY.getTime()-TODAY.getTimezoneOffset()*60000).toISOString().slice(0,10);
const won=n=>n==null||isNaN(n)?'-':Math.round(n).toLocaleString('ko-KR');
const man=n=>n==null?'-':(Math.round(n/1000)/10).toLocaleString('ko-KR')+'만';
const sg=v=>v>0?'+'+v:''+v;
const addM=(s,k)=>{const [y,m,d]=s.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+k,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return t.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const TAX={'일반과세':0.154,'세금우대':0.014,'비과세':0};
const termN=m=>parseInt(m.term)||0;

/* ---------- 공통 UI: 확인 모달, 진행 알림, 토스트 ---------- */
let cfAction=null;
function ask(opt,onOk){cfAction=onOk;$('cfTitle').textContent=opt.title||'확인';$('cfBody').innerHTML=opt.body||'';$('cfOk').textContent=opt.ok||'확인';$('cfIcon').textContent=opt.danger?'⚠️':'❓';$('cfPanel').classList.toggle('danger',!!opt.danger);$('confirmBox').classList.add('show');setTimeout(()=>(opt.danger?$('cfCancel'):$('cfOk')).focus(),0)}
function closeAsk(run){$('confirmBox').classList.remove('show');const f=cfAction;cfAction=null;if(run&&f)f()}
$('cfOk').onclick=()=>closeAsk(true);$('cfCancel').onclick=()=>closeAsk(false);
$('confirmBox').addEventListener('click',e=>{if(e.target===$('confirmBox'))closeAsk(false)});

function flow(){const months={},mk=s=>s.slice(0,7),cur=mk(todayS);
 const ensure=k=>months[k]||(months[k]={out:0,late:0,inn:0,items:[]});
 DATA.filter(m=>status(m)==='진행').forEach(m=>{
  if(m.inst)m.inst.forEach(i=>{if(i.paid)return;const d=i.act||i.plan;if(!d)return;if(d<todayS){ensure(cur).late+=m.amount;return}ensure(mk(d)).out+=m.amount});
  if(m.fund){const e=ensure(mk(m.end)),M=mat(m),al=allocOf(m.id);e.inn+=M;e.items.push(esc(m.branch)+' '+man(M)+(al?` (배분 ${man(al)} / 남음 ${man(M-al)})`:''))}});
 const keys=Object.keys(months).sort();let pool=0,cashTotal=0;
 const rows=keys.map(k=>{const e=months[k];pool+=e.inn;const need=e.out+e.late,use=Math.min(pool,need);pool-=use;const cash=need-use;cashTotal+=cash;return{k,...e,use,cash,pool}});

 rows.map(r=>`<tr><td class="l">${r.k}</td><td>${won(r.out)}</td><td class="${r.late?'neg':''}">${r.late?won(r.late):'-'}</td><td class="${r.inn?'pos':''}">${r.inn?won(r.inn):'-'}</td><td>${r.use?won(r.use):'-'}</td><td class="${r.cash?'neg':''}">${r.cash?won(r.cash):'-'}</td><td>${won(r.pool)}</td><td class="l"><span class="bar" style="width:${(r.out+r.late)/mx*120}px"></span> <span class="bar in" style="width:${r.inn/mx*120}px"></span></td><td class="l sub">${r.items.join(', ')}</td></tr>`).join('')+`</tbody></table></div>

function warns(){const w=[];DATA.filter(m=>status(m)==='진행').forEach(m=>{const add=(lv,t,k)=>w.push({id:m.id,lv,t,k,name:m.branch+' '+m.product});
 if(m.inst){const late=m.inst.filter(i=>!i.paid&&i.act&&i.act<todayS);if(late.length)add('bad',`지연 미납 ${late.length}회 (${late[0].n}회차부터) — 날짜가 지났는데 납입 체크가 없습니다.`);

  const pm=/(\d+)\/(\d+)/.exec(m.excelProg||'');if(pm&&(+pm[1]!==paidCnt(m)||+pm[2]!==m.inst.length))add('warn',`엑셀 진행 표시(${m.excelProg})와 납입 체크 ${paidCnt(m)}회/총 ${m.inst.length}회가 다릅니다. 앱의 납입 체크가 맞으면 "확인 완료"를 누르세요.`,'prog');

 DATA.forEach(m=>{const nm=m.branch+' '+m.product,seen={};m.funds.forEach(f=>{if(!f.from||!fAmt(m,f))w.push({id:m.id,lv:'warn',t:'재원 연결의 출처나 회차가 비어 있습니다.',name:nm});
  if(fRanged(f)&&!f.done&&f.date&&f.date<todayS)w.push({id:m.id,lv:'bad',t:`만기금 납입 예정일(${f.date})이 지났습니다. 실제로 냈으면 재원 탭에서 "납입 확인"을 눌러 주세요. (${f.n1}~${f.n2}회)`,name:nm});
